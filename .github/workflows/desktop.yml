name: desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    env:
      DISQUISITION_BUILD_CHANNEL: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: disquisition-desktop-linux-x64
            openssl-root: ''
          - os: macos-15
            artifact: disquisition-desktop-macos-arm64
            openssl-root: /opt/homebrew/opt/openssl@3
          - os: windows-2022
            artifact: disquisition-desktop-windows-x64
            openssl-root: 'C:/vcpkg/installed/x64-windows-static-md'
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: qtmultimedia
          cache: true

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libssl-dev libxcb1-dev pkg-config libavcodec-dev libavutil-dev libswscale-dev

      - name: Install macOS desktop dependencies
        if: runner.os == 'macOS'
        run: brew install openssl@3 sqlite ffmpeg pkgconf

      - name: Restore Windows vcpkg cache
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-openssl-sqlite3-pkgconf-x64-windows-v1

      - name: Install Windows desktop dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .vcpkg-cache -Force | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE = Join-Path $env:GITHUB_WORKSPACE '.vcpkg-cache'
          & (Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe') install openssl:x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe') install pkgconf:x64-windows sqlite3:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installed = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x64-windows'
          "PKG_CONFIG=$installed/tools/pkgconf/pkgconf.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$installed/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install prebuilt Windows FFmpeg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Use a retained monthly LGPL shared build, including headers and MSVC import libraries.
          $release = 'autobuild-2026-09-30-13-08'
          $package = 'ffmpeg-n8.1.3-9-g29e619e767-win64-lgpl-shared-8.1'
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/$release/$package.zip" -OutFile $archive
          $expectedHash = '3e47bda1607740550141e37c0e49d1e5182b34699f15adfd137ee266d346811a'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedHash) {
            throw 'FFmpeg archive checksum mismatch'
          }
          Expand-Archive $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'ffmpeg')
          $ffmpeg = Join-Path $env:RUNNER_TEMP "ffmpeg/$package"
          "FFMPEG_ROOT=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$ffmpeg/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$ffmpeg/lib/pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        if: runner.os != 'Windows'
        env:
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
        run: cmake -S . -B build -DBUILD_DESKTOP_APP=ON -DBUILD_RELAY=OFF -DOPENSSL_USE_STATIC_LIBS=ON -DOPENSSL_ROOT_DIR="${{ matrix.openssl-root }}" "-DDISQUISITION_BUILD_CHANNEL=$DISQUISITION_BUILD_CHANNEL" "-DDISQUISITION_KLIPY_API_KEY=$KLIPY_API_KEY"

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
        run: cmake -S . -B build -DBUILD_DESKTOP_APP=ON -DBUILD_RELAY=OFF -DOPENSSL_USE_STATIC_LIBS=ON -DOPENSSL_ROOT_DIR="${{ matrix.openssl-root }}" "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows "-DDISQUISITION_BUILD_CHANNEL=$env:DISQUISITION_BUILD_CHANNEL" "-DDISQUISITION_KLIPY_API_KEY=$env:KLIPY_API_KEY"

      - name: Build desktop and all tests
        run: cmake --build build --config Release --parallel

      - name: Test community and media behavior
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Linux build
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/licenses
          cp build/disquisition-desktop dist/
          cp /usr/share/doc/libssl-dev/copyright dist/licenses/OpenSSL.LICENSE
          cp build/_deps/community_zxing-src/LICENSE dist/licenses/ZXing.LICENSE
          tar -czf disquisition-desktop-linux-x64.tar.gz -C dist .

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          app=$(cat build/disquisition-app-bundle-Release.txt)
          mkdir -p "$app/Contents/Resources/licenses"
          cp "$(brew --prefix openssl@3)/LICENSE.txt" "$app/Contents/Resources/licenses/OpenSSL.LICENSE"
          cp build/_deps/community_zxing-src/LICENSE "$app/Contents/Resources/licenses/ZXing.LICENSE"
          scripts/package-macos.sh "$app" disquisition-desktop-macos-arm64.dmg

      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item build/Release/disquisition-desktop.exe dist/
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" dist/
          New-Item -ItemType Directory -Path dist/licenses | Out-Null
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md/share/openssl/copyright" dist/licenses/OpenSSL.LICENSE
          Copy-Item build/_deps/community_zxing-src/LICENSE dist/licenses/ZXing.LICENSE
          windeployqt --release --no-translations dist/disquisition-desktop.exe
          Copy-Item "$env:FFMPEG_ROOT/bin/*.dll" dist/
          Copy-Item "$env:FFMPEG_ROOT/LICENSE.txt" dist/licenses/FFmpeg.LICENSE
          Compress-Archive -Path dist/* -DestinationPath disquisition-desktop-windows-x64.zip

      - name: Upload desktop build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
          if-no-files-found: error

  release:
    name: Publish desktop release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Keep every push queued, and serialize changes to the latest release.
    concurrency:
      group: desktop-main-releases
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4

      - name: Download desktop archives
        uses: actions/download-artifact@v8
        with:
          pattern: disquisition-desktop-*
          merge-multiple: true
          path: release-assets

      - name: Publish release with download links
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/publish-desktop-release.sh
