name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: disquisition-linux-x64
            deps: |
              sudo apt-get update
              sudo apt-get install -y libncurses-dev libsqlite3-dev libssl-dev
          - os: macos-latest
            artifact: disquisition-macos-arm64
            deps: brew install sqlite ncurses openssl@3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        if: ${{ matrix.deps != '' }}
        run: ${{ matrix.deps }}

      - name: Install Qt for communities
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      - name: Build
        run: make

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/client
            build/server
            build/relay
