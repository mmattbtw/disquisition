name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: disquisition-linux-x64
            deps: |
              sudo apt-get update
              sudo apt-get install -y libncurses-dev libsqlite3-dev
          - os: macos-latest
            artifact: disquisition-macos-arm64
            deps: brew install sqlite ncurses
    # Keep fork pull requests on GitHub-hosted runners.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","truenas","disquisition"]') || matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        if: ${{ matrix.deps != '' && runner.environment != 'self-hosted' }}
        run: ${{ matrix.deps }}

      - name: Build
        run: |
          cmake -S . -B build
          cmake --build build --parallel 2

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/client
            build/server
            build/relay
