name: server build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: server build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install SQLite on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Install SQLite on macOS
        if: runner.os == 'macOS'
        run: brew install sqlite

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_DESKTOP_APP=OFF
          -DBUILD_LEGACY_TARGETS=ON
          -DBUILD_TESTING=OFF

      - name: Build server
        run: cmake --build build --target server --parallel

      - name: Prepare server download
        run: cp build/server build/disquisition-server-${{ matrix.platform }}

      - name: Upload server
        uses: actions/upload-artifact@v7
        with:
          path: build/disquisition-server-${{ matrix.platform }}
          archive: false
          if-no-files-found: error
