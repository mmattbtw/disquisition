name: desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    env:
      DISQUISITION_BUILD_CHANNEL: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      # Matches the main-<run number> release tag. 0 disables updates.
      DISQUISITION_BUILD_NUMBER: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.run_number || 0 }}
      # Pull requests check out a detached merge commit; show the PR's own branch and head.
      DISQUISITION_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
      DISQUISITION_GIT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: disquisition-desktop-linux-x64
            openssl-root: ''
            qt: '6.12.0'
          - os: macos-15
            artifact: disquisition-desktop-macos-arm64
            openssl-root: /opt/homebrew/opt/openssl@3
            qt: '6.12.0'
          - os: windows-2022
            artifact: disquisition-desktop-windows-x64
            openssl-root: 'C:/vcpkg/installed/x64-windows-static-md'
            # aqtinstall 3.3 cannot read the Windows download layout Qt 6.11+ uses.
            qt: '6.10.3'
    steps:
      - uses: actions/checkout@v4

      # install-qt-action otherwise picks the newest Python, which on Windows is
      # 3.15 and has no py7zr dependency wheels yet, so they compile every run.
      - name: Set up Python for Qt installer
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          modules: qtmultimedia
          cache: true
          setup-python: false

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libssl-dev libxcb1-dev pkg-config libavcodec-dev libavutil-dev libpulse-dev libswresample-dev libswscale-dev

      - name: Install macOS desktop dependencies
        if: runner.os == 'macOS'
        run: brew install openssl@3 sqlite ffmpeg pkgconf

      - name: Install Windows desktop dependencies
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-desktop-deps

      # The test workflow builds and runs the tests on every platform.
      - name: Configure
        if: runner.os != 'Windows'
        env:
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
        run: cmake -S . -B build -DBUILD_DESKTOP_APP=ON -DBUILD_RELAY=OFF -DBUILD_TESTING=OFF -DOPENSSL_USE_STATIC_LIBS=ON -DOPENSSL_ROOT_DIR="${{ matrix.openssl-root }}" "-DDISQUISITION_BUILD_CHANNEL=$DISQUISITION_BUILD_CHANNEL" "-DDISQUISITION_BUILD_NUMBER=$DISQUISITION_BUILD_NUMBER" "-DDISQUISITION_GIT_BRANCH=$DISQUISITION_GIT_BRANCH" "-DDISQUISITION_GIT_COMMIT=$DISQUISITION_GIT_COMMIT" "-DDISQUISITION_UPDATE_REPOSITORY=${{ github.repository }}" "-DDISQUISITION_KLIPY_API_KEY=$KLIPY_API_KEY"

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_DESKTOP_APP=ON -DBUILD_RELAY=OFF -DBUILD_TESTING=OFF -DOPENSSL_USE_STATIC_LIBS=ON -DOPENSSL_ROOT_DIR="${{ matrix.openssl-root }}" "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows "-DDISQUISITION_BUILD_CHANNEL=$env:DISQUISITION_BUILD_CHANNEL" "-DDISQUISITION_BUILD_NUMBER=$env:DISQUISITION_BUILD_NUMBER" "-DDISQUISITION_GIT_BRANCH=$env:DISQUISITION_GIT_BRANCH" "-DDISQUISITION_GIT_COMMIT=$env:DISQUISITION_GIT_COMMIT" "-DDISQUISITION_UPDATE_REPOSITORY=${{ github.repository }}" "-DDISQUISITION_KLIPY_API_KEY=$env:KLIPY_API_KEY"

      - name: Build desktop
        run: cmake --build build --config Release --parallel

      - name: Package Linux build
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/licenses
          cp build/disquisition-desktop dist/
          cp /usr/share/doc/libssl-dev/copyright dist/licenses/OpenSSL.LICENSE
          cp build/_deps/community_zxing-src/LICENSE dist/licenses/ZXing.LICENSE
          tar -czf disquisition-desktop-linux-x64.tar.gz -C dist .

      # Fork pull requests get no secrets and stay ad-hoc signed.
      - name: Set up macOS signing and notarization
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [[ -z $MACOS_CERTIFICATE_P12 ]]; then
            echo "No signing certificate; the DMG will be ad-hoc signed and not notarized."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          base64 --decode <<< "$MACOS_CERTIFICATE_P12" > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          # The certificate chains to this intermediate, which runners may lack.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | grep -o '"Developer ID Application: [^"]*"' | head -n 1 | tr -d '"')
          if [[ -z $identity ]]; then
            echo "MACOS_CERTIFICATE_P12 has no valid Developer ID Application identity." >&2
            exit 1
          fi
          echo "DISQUISITION_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "DISQUISITION_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          if [[ -n $APPLE_API_KEY_P8 ]]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
            echo "DISQUISITION_NOTARY_KEY=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"
            echo "DISQUISITION_NOTARY_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
            echo "DISQUISITION_NOTARY_ISSUER=$APPLE_API_ISSUER_ID" >> "$GITHUB_ENV"
          else
            echo "No notarization key; the DMG will be signed but not notarized."
          fi

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          app=$(cat build/disquisition-app-bundle-Release.txt)
          mkdir -p "$app/Contents/Resources/licenses"
          cp "$(brew --prefix openssl@3)/LICENSE.txt" "$app/Contents/Resources/licenses/OpenSSL.LICENSE"
          cp build/_deps/community_zxing-src/LICENSE "$app/Contents/Resources/licenses/ZXing.LICENSE"
          scripts/package-macos.sh "$app" disquisition-desktop-macos-arm64.dmg

      - name: Remove macOS signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          [[ -z ${DISQUISITION_SIGNING_KEYCHAIN:-} ]] || security delete-keychain "$DISQUISITION_SIGNING_KEYCHAIN"
          rm -f "$RUNNER_TEMP/notary-key.p8"

      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item build/disquisition-desktop.exe dist/
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" dist/
          New-Item -ItemType Directory -Path dist/licenses | Out-Null
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md/share/openssl/copyright" dist/licenses/OpenSSL.LICENSE
          Copy-Item build/_deps/community_zxing-src/LICENSE dist/licenses/ZXing.LICENSE
          # The MSVC environment makes windeployqt add the VC++ redistributable
          # installer; keep the archive as it was without that environment.
          windeployqt --release --no-translations --no-compiler-runtime dist/disquisition-desktop.exe
          Copy-Item "$env:FFMPEG_ROOT/bin/*.dll" dist/
          Copy-Item "$env:FFMPEG_ROOT/LICENSE.txt" dist/licenses/FFmpeg.LICENSE
          Compress-Archive -Path dist/* -DestinationPath disquisition-desktop-windows-x64.zip

      - name: Upload desktop build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
          if-no-files-found: error

  release:
    name: Publish desktop release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Keep every push queued, and serialize changes to the latest release.
    concurrency:
      group: desktop-main-releases
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4

      - name: Download desktop archives
        uses: actions/download-artifact@v8
        with:
          pattern: disquisition-desktop-*
          merge-multiple: true
          path: release-assets

      - name: Publish release with download links
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/publish-desktop-release.sh
