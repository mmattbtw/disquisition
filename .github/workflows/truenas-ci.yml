name: TrueNAS build and test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truenas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    if: github.repository == 'mmattbtw/disquisition' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, truenas, disquisition]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_DESKTOP_APP=OFF
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
