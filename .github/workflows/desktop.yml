name: desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    env:
      DISQUISITION_BUILD_CHANNEL: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      # MSVC reads extra flags from CL; /MP compiles each project's sources in
      # parallel instead of one file at a time. Other compilers ignore it.
      CL: /MP
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: disquisition-desktop-linux-x64
            audio-module: alsa
            re-library: libre.a
            static-openssl: 'ON'
            openssl-root: ''
          - os: macos-15
            artifact: disquisition-desktop-macos-arm64
            audio-module: coreaudio
            re-library: libre.a
            static-openssl: 'ON'
            openssl-root: /opt/homebrew/opt/openssl@3
          - os: windows-2022
            artifact: disquisition-desktop-windows-x64
            audio-module: wasapi
            re-library: re-static.lib
            static-openssl: 'ON'
            openssl-root: 'C:/vcpkg/installed/x64-windows-static-md'
    steps:
      - uses: actions/checkout@v4

      - name: Check out libre
        uses: actions/checkout@v4
        with:
          repository: baresip/re
          ref: v4.11.0
          path: third_party/re

      - name: Check out baresip
        uses: actions/checkout@v4
        with:
          repository: baresip/baresip
          ref: v4.11.0
          path: third_party/baresip

      # install-qt-action otherwise picks the newest Python, which on Windows is
      # 3.15 and has no py7zr dependency wheels yet, so they compile every run.
      - name: Set up Python for Qt installer
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: qtmultimedia
          cache: true
          setup-python: false

      - name: Install Linux voice dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libssl-dev libxcb1-dev pkg-config libavcodec-dev libavutil-dev libswscale-dev

      - name: Install macOS voice dependencies
        if: runner.os == 'macOS'
        run: brew install openssl@3 ffmpeg pkgconf

      # The Windows caches below hold binaries built with the runner image's MSVC
      # and vcpkg ports tree, so key them on the image: a cache from an older
      # image would otherwise keep restoring stale binaries and never be replaced.
      - name: Identify Windows runner image
        id: image
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "id=$env:ImageOS-$env:ImageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Cache the installed tree rather than vcpkg's binary cache: even when every
      # package is cached, vcpkg install spends ~40s fetching CMake and hashing the compiler.
      - name: Restore Windows vcpkg packages
        id: vcpkg-cache
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: C:/vcpkg/installed
          key: vcpkg-installed-${{ steps.image.outputs.id }}-openssl-sqlite3-pkgconf

      - name: Install Windows voice dependencies
        if: runner.os == 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & (Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe') install openssl:x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe') install pkgconf:x64-windows sqlite3:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Save as soon as the packages are built, so a later build failure doesn't discard them.
      - name: Save Windows vcpkg packages
        if: runner.os == 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:/vcpkg/installed
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Use vcpkg pkg-config
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installed = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x64-windows'
          "PKG_CONFIG=$installed/tools/pkgconf/pkgconf.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install prebuilt Windows FFmpeg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Use a retained monthly LGPL shared build, including headers and MSVC import libraries.
          $release = 'autobuild-2026-09-30-13-08'
          $package = 'ffmpeg-n8.1.3-9-g29e619e767-win64-lgpl-shared-8.1'
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/$release/$package.zip" -OutFile $archive
          $expectedHash = '3e47bda1607740550141e37c0e49d1e5182b34699f15adfd137ee266d346811a'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedHash) {
            throw 'FFmpeg archive checksum mismatch'
          }
          Expand-Archive $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'ffmpeg')
          $ffmpeg = Join-Path $env:RUNNER_TEMP "ffmpeg/$package"
          "FFMPEG_ROOT=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PKG_CONFIG_PATH=$ffmpeg/lib/pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append

      # libre and baresip are pinned, so reuse the built baresip.exe until the
      # image (MSVC, vcpkg OpenSSL) or the build inputs in this workflow change.
      - name: Restore Windows baresip build
        id: baresip-cache
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: build-baresip/output
          key: baresip-${{ steps.image.outputs.id }}-${{ hashFiles('.github/workflows/desktop.yml', 'cmake/bundled-baresip/**') }}

      - name: Build libre
        if: steps.baresip-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S third_party/re -B build-re -DCMAKE_BUILD_TYPE=Release -DLIBRE_BUILD_SHARED=OFF -DOPENSSL_USE_STATIC_LIBS=${{ matrix.static-openssl }} -DOPENSSL_ROOT_DIR="${{ matrix.openssl-root }}" -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/baresip-prefix"
          cmake --build build-re --config Release --target re --parallel
          cmake --install build-re --config Release

      - name: Build baresip with voice modules
        if: steps.baresip-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S cmake/bundled-baresip -B build-baresip -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ github.workspace }}/baresip-prefix" -DBARESIP_SOURCE_DIR="${{ github.workspace }}/third_party/baresip" -DBARESIP_AUDIO_MODULE=${{ matrix.audio-module }} -DRE_INCLUDE_DIR="${{ github.workspace }}/baresip-prefix/include/re" -DRE_LIBRARY="${{ github.workspace }}/baresip-prefix/lib/${{ matrix.re-library }}" -DOPENSSL_USE_STATIC_LIBS=${{ matrix.static-openssl }} -DOPENSSL_ROOT_DIR="${{ matrix.openssl-root }}"
          cmake --build build-baresip --config Release --target baresip_exe --parallel

      - name: Save Windows baresip build
        if: runner.os == 'Windows' && steps.baresip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build-baresip/output
          key: ${{ steps.baresip-cache.outputs.cache-primary-key }}

      - name: Configure
        if: runner.os != 'Windows'
        env:
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
        run: cmake -S . -B build -DBUILD_DESKTOP_APP=ON -DBUILD_LEGACY_TARGETS=OFF "-DDISQUISITION_BUILD_CHANNEL=$DISQUISITION_BUILD_CHANNEL" "-DDISQUISITION_KLIPY_API_KEY=$KLIPY_API_KEY"

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
        run: cmake -S . -B build -DBUILD_DESKTOP_APP=ON -DBUILD_LEGACY_TARGETS=OFF "-DDISQUISITION_BUILD_CHANNEL=$env:DISQUISITION_BUILD_CHANNEL" "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows "-DDISQUISITION_KLIPY_API_KEY=$env:KLIPY_API_KEY"

      - name: Build desktop client
        run: cmake --build build --config Release --target disquisition-desktop --parallel

      - name: Package Linux build
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/licenses
          cp build/disquisition-desktop build-baresip/output/baresip dist/
          cp third_party/baresip/LICENSE dist/licenses/baresip.LICENSE
          cp third_party/re/LICENSE dist/licenses/libre.LICENSE
          cp /usr/share/doc/libssl-dev/copyright dist/licenses/OpenSSL.LICENSE
          tar -czf disquisition-desktop-linux-x64.tar.gz -C dist .

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          app=$(cat build/disquisition-app-bundle-Release.txt)
          mkdir -p "$app/Contents/Resources/licenses"
          cp third_party/baresip/LICENSE "$app/Contents/Resources/licenses/baresip.LICENSE"
          cp third_party/re/LICENSE "$app/Contents/Resources/licenses/libre.LICENSE"
          cp "$(brew --prefix openssl@3)/LICENSE.txt" "$app/Contents/Resources/licenses/OpenSSL.LICENSE"
          scripts/package-macos.sh "$app" build-baresip/output/baresip disquisition-desktop-macos-arm64.dmg

      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item build/Release/disquisition-desktop.exe dist/
          Copy-Item build-baresip/output/baresip.exe dist/
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" dist/
          New-Item -ItemType Directory -Path dist/licenses | Out-Null
          Copy-Item third_party/baresip/LICENSE dist/licenses/baresip.LICENSE
          Copy-Item third_party/re/LICENSE dist/licenses/libre.LICENSE
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md/share/openssl/copyright" dist/licenses/OpenSSL.LICENSE
          windeployqt --release --no-translations dist/disquisition-desktop.exe
          Copy-Item "$env:FFMPEG_ROOT/bin/*.dll" dist/
          Copy-Item "$env:FFMPEG_ROOT/LICENSE.txt" dist/licenses/FFmpeg.LICENSE
          Compress-Archive -Path dist/* -DestinationPath disquisition-desktop-windows-x64.zip

      - name: Upload desktop build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
          if-no-files-found: error

  release:
    name: Publish desktop release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Keep every push queued, and serialize changes to the latest release.
    concurrency:
      group: desktop-main-releases
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4

      - name: Download desktop archives
        uses: actions/download-artifact@v8
        with:
          pattern: disquisition-desktop-*
          merge-multiple: true
          path: release-assets

      - name: Publish release with download links
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/publish-desktop-release.sh
