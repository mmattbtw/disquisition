name: relay

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: disquisition-relay-linux-x64
            deps: |
              sudo apt-get update
              sudo apt-get install -y libssl-dev
          - os: macos-latest
            artifact: disquisition-relay-macos-arm64
            deps: brew install openssl@3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        if: ${{ matrix.deps != '' }}
        run: ${{ matrix.deps }}

      - name: Install Qt for communities
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      - name: Build
        run: |
          cmake -S . -B build -DBUILD_DESKTOP_APP=OFF -DBUILD_TESTING=OFF
          cmake --build build --target relay --parallel

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: build/relay
          if-no-files-found: error
