name: 3DS homebrew

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  homebrew:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20260610
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build Nintendo 3DS client
        run: make -C src/3ds -j2
      - name: Package SD card folder
        run: |
          mkdir -p build-3ds/3ds/disquisition
          cp src/3ds/disquisition.3dsx src/3ds/disquisition.smdh build-3ds/3ds/disquisition/
          cp src/3ds/README.md build-3ds/3ds/disquisition/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: disquisition-3ds
          path: build-3ds/
          if-no-files-found: error
